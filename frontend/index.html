<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeiCrit - Critical Apparatus Editor</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-xml.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>HeiCrit</h1>
            <p>Critical Apparatus Editor</p>
        </header>
        
        <main>
            <div class="toolbar">
                <button id="openFile">Open File</button>
                <button id="openProjectDirectory">Open Project Directory</button>
                <button id="saveFile">Save File</button>
                <button id="saveAsFile">Save As</button>
            </div>
            
            <div class="workspace">
                <div class="editor-panel">
                    <div class="editor-header">
                        <span id="currentFile">No file selected</span>
                    </div>
                    
                    <!-- XML Editor Container -->
                    <div id="xml-editor-container" class="view-container">
                        <textarea id="editor-textarea" placeholder="Open or create a file to start editing..."></textarea>
                        <pre id="editor-highlight"><code id="editor-code" class="language-xml"></code></pre>
                    </div>
                    
                    <!-- Apparatus Display Container -->
                    <div id="apparatus-container" class="view-container" style="display: none;">
                        <div class="apparatus-layout">
                            <div id="main-text-panel" class="text-panel">
                                <h3>Main Text (Leithandschrift)</h3>
                                <div id="main-text-content"></div>
                            </div>
                            <div id="apparatus-panel" class="apparatus-panel">
                                <div class="apparatus-header-controls">
                                    <h3>Critical Apparatus</h3>
                                    <div class="apparatus-navigation" style="display: none;">
                                        <button id="apparatus-prev" class="nav-button">← Previous</button>
                                        <span id="apparatus-counter" class="entry-counter">1 / 1</span>
                                        <button id="apparatus-next" class="nav-button">Next →</button>
                                        <div class="goto-controls">
                                            <span>Go to:</span>
                                            <input type="number" id="goto-loc-input" placeholder="loc" min="1" class="goto-input">
                                            <button id="goto-loc-button" class="goto-button">Go</button>
                                        </div>
                                    </div>
                                </div>
                                <div id="apparatus-content"></div>
                                <div id="apparatus-details" class="apparatus-details">
                                    <h4>Details</h4>
                                    <div id="apparatus-details-content">Click on a location number to see details</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <div id="status">Ready</div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
