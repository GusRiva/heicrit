<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeiCrit - Critical Apparatus Editor</title>
    <!-- Web Font for consistent monospace rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-xml.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <nav class="navbar">
                <div class="navbar-left">
                    <div class="dropdown">
                        <button class="dropdown-toggle">File</button>
                        <div class="dropdown-menu">
                            <button id="openProjectDirectory">Open Project</button>
                            <button id="saveProject">Save Project</button>
                            <hr class="dropdown-divider">
                            <button id="openFile">Open File</button>
                            <button id="saveAsFile">Save File As</button>
                            <button id="saveFile">Save File</button>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="dropdown-toggle">Edit</button>
                        <div class="dropdown-menu">
                            <button disabled>Undo</button>
                            <button disabled>Redo</button>
                            <hr class="dropdown-divider">
                            <button disabled>Find</button>
                            <button disabled>Replace</button>
                        </div>
                    </div>
                </div>
                <div class="navbar-title">HeiCrit Critical Apparatus Editor</div>
            </nav>
            
            <div class="toolbar">
                <button id="openProjectDirectoryIcon" class="toolbar-icon" title="Open Project Directory">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M1.5 1A1.5 1.5 0 0 0 0 2.5v11A1.5 1.5 0 0 0 1.5 15h13a1.5 1.5 0 0 0 1.5-1.5V4a1.5 1.5 0 0 0-1.5-1.5H7.5L6 1H1.5z"/>
                    </svg>
                </button>
                <button id="saveProjectIcon" class="toolbar-icon" title="Save Project">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 640 640" fill="currentColor">
                        <path d="M160 96C124.7 96 96 124.7 96 160L96 480C96 515.3 124.7 544 160 544L480 544C515.3 544 544 515.3 544 480L544 237.3C544 220.3 537.3 204 525.3 192L448 114.7C436 102.7 419.7 96 402.7 96L160 96zM192 192C192 174.3 206.3 160 224 160L384 160C401.7 160 416 174.3 416 192L416 256C416 273.7 401.7 288 384 288L224 288C206.3 288 192 273.7 192 256L192 192zM320 352C355.3 352 384 380.7 384 416C384 451.3 355.3 480 320 480C284.7 480 256 451.3 256 416C256 380.7 284.7 352 320 352z"/></svg>
                </button>
            </div>
        </header>
        
        <main>
            <div class="workspace">
                <div class="tab-bar">
                    <div class="tab-list" id="tabList">
                        <!-- Tabs will be added dynamically -->
                    </div>
                </div>
                
                <div class="editor-panel">
                    <div class="tab-content" id="tabContent">
                        <div class="empty-workspace">
                            <p>No files or projects open</p>
                            <p>Use <strong>File → Open Project Directory</strong> or <strong>File → Open File</strong> to get started</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <div id="status">Ready</div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
