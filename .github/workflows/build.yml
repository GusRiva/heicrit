# Desktop (Electron) build pipeline for the GitHub mirror of this repo.
# A matching pipeline lives in .gitlab-ci-template.yml for GitLab (the canonical
# origin) — keep both in sync when changing the build matrix.
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # permissions.contents:write below is needed for electron-builder to publish
  # GitHub Releases — GitHub-specific, intentionally not mirrored into
  # .gitlab-ci-template.yml.
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64

    steps:
      - name: Configure GitLab submodule access
        run: git config --global url."https://${{ secrets.HEIPY_GITLAB_USER }}:${{ secrets.HEIPY_GITLAB_TOKEN }}@gitlab.ub.uni-heidelberg.de/".insteadOf "https://gitlab.ub.uni-heidelberg.de/"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create Python virtual environment (Linux/macOS)
        if: matrix.platform != 'win'
        run: python -m venv venv

      - name: Activate venv and install Python dependencies (Linux/macOS)
        if: matrix.platform != 'win'
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      # Windows: a normal `python -m venv venv` isn't relocatable off this
      # runner - Scripts/python.exe finds its stdlib/DLLs via pyvenv.cfg's
      # "home", an absolute path to actions/setup-python's install under
      # C:\hostedtoolcache\..., which won't exist on an end user's PC (the
      # backend would silently fail to start in the packaged app). Instead,
      # copy that whole self-contained Python installation (setup-python
      # exposes its root as $env:pythonLocation) directly into venv/, and
      # install deps with `-m pip` rather than Scripts\pip.exe, whose
      # generated launcher also bakes in a build-time absolute path. See
      # electron/main.js's resolvePythonPath for the matching runtime lookup.
      - name: Vendor a self-contained Python (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: Copy-Item -Path $env:pythonLocation -Destination venv -Recurse

      - name: Install Python dependencies (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: venv\python.exe -m pip install -r requirements.txt

      - name: Build and publish Electron app (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron app (manual run, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.xz
            dist/*.deb