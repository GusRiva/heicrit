# Desktop (Electron) build pipeline for the GitHub mirror of this repo.
# A matching pipeline lives in .gitlab-ci-template.yml for GitLab (the canonical
# origin) — keep both in sync when changing the build matrix.
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: x64

    steps:
      - name: Configure GitLab submodule access
        run: git config --global url."https://${{ secrets.HEIPY_GITLAB_USER }}:${{ secrets.HEIPY_GITLAB_TOKEN }}@gitlab.ub.uni-heidelberg.de/".insteadOf "https://gitlab.ub.uni-heidelberg.de/"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create Python virtual environment
        run: |
          python -m venv venv
          
      - name: Activate venv and install Python dependencies (Linux/macOS)
        if: matrix.platform != 'win'
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Activate venv and install Python dependencies (Windows)
        if: matrix.platform == 'win'
        run: |
          venv\Scripts\activate
          pip install -r requirements.txt

      - name: Build Electron app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.xz
            dist/*.deb