# Desktop (Electron) build pipeline for the GitHub mirror of this repo.
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (manual runs only; tag pushes always build all)'
        type: choice
        options: [all, linux, win, mac]
        default: all

jobs:
  # The matrix context isn't available in a job-level `if`, so filtering the
  # matrix down to one platform for a manual dispatch has to happen here,
  # before the build job's strategy is evaluated.
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          case "${{ inputs.platform || 'all' }}" in
            linux) echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux","arch":"x64"}]}' >> "$GITHUB_OUTPUT" ;;
            win)   echo 'matrix={"include":[{"os":"windows-latest","platform":"win","arch":"x64"}]}' >> "$GITHUB_OUTPUT" ;;
            mac)   echo 'matrix={"include":[{"os":"macos-latest","platform":"mac","arch":"x64"}]}' >> "$GITHUB_OUTPUT" ;;
            *)     echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux","arch":"x64"},{"os":"windows-latest","platform":"win","arch":"x64"},{"os":"macos-latest","platform":"mac","arch":"x64"}]}' >> "$GITHUB_OUTPUT" ;;
          esac

  # permissions.contents:write below is needed for electron-builder to publish
  # GitHub Releases.
  build:
    needs: set-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}

    steps:
      # Redirect the heipy submodule to its public GitHub mirror instead of
      # the university GitLab (unreliable/slow to reach from some GitHub
      # runner regions - see git history for the stalls this caused). Exact
      # URL match only, so .gitmodules is unaffected. http.lowSpeedLimit/Time
      # is kept as a safety net so any future stalled transfer aborts instead
      # of hanging forever.
      - name: Redirect heipy submodule to its GitHub mirror
        run: |
          git config --global url."https://github.com/GusRiva/heipy.git".insteadOf "https://gitlab.ub.uni-heidelberg.de/editions/heipy.git"
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Fetch submodules (retry on stall)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            git submodule sync --recursive && \
              git submodule update --init --recursive --depth=1 && exit 0
            echo "Submodule fetch attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "Submodule fetch failed after 3 attempts" >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Create Python virtual environment (Linux/macOS)
        if: matrix.platform != 'win'
        run: python -m venv venv

      - name: Activate venv and install Python dependencies (Linux/macOS)
        if: matrix.platform != 'win'
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      # Windows: a normal `python -m venv venv` isn't relocatable off this
      # runner - Scripts/python.exe finds its stdlib/DLLs via pyvenv.cfg's
      # "home", an absolute path to actions/setup-python's install under
      # C:\hostedtoolcache\..., which won't exist on an end user's PC (the
      # backend would silently fail to start in the packaged app). Instead,
      # copy that whole self-contained Python installation (setup-python
      # exposes its root as $env:pythonLocation) directly into venv/, and
      # install deps with `-m pip` rather than Scripts\pip.exe, whose
      # generated launcher also bakes in a build-time absolute path. See
      # electron/main.js's resolvePythonPath for the matching runtime lookup.
      - name: Vendor a self-contained Python (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: Copy-Item -Path $env:pythonLocation -Destination venv -Recurse

      - name: Install Python dependencies (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: venv\python.exe -m pip install -r requirements.txt

      - name: Build and publish Electron app (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron app (manual run, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.xz
            dist/*.deb