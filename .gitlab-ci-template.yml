# Desktop (Electron) build pipeline for GitLab.
# A matching workflow lives in .github/workflows/build.yml for the GitHub mirror
# of this repo — keep both in sync when changing the build matrix.

stages:
  - build

variables:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

# Linux build
build:linux:
  stage: build
  image: node:22
  services:
    - name: python:3.12
  before_script:
    - apt-get update -qq && apt-get install -y python3 python3-pip python3-venv
    - npm ci
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
  script:
    - npm run dist
  artifacts:
    paths:
      - dist/*.tar.xz
      - dist/*.AppImage
      - dist/*.deb
    expire_in: 1 week
  only:
    - tags
    - main
  tags:
    - linux

# Windows build
# NOT kept in sync with .github/workflows/build.yml's Windows job fix for
# venv relocatability (see electron/main.js's resolvePythonPath) - this job
# cross-compiles via Wine inside a Linux container, so `python -m venv venv`
# here creates a Linux-layout venv (bin/, not Scripts/) while the very next
# line references venv/Scripts/activate.bat (a Windows-only file that won't
# exist), which looks broken independent of the relocatability issue. Needs
# its own fix (e.g. installing a real Windows Python under Wine) - flagged
# here rather than silently guessed at.
build:windows:
  stage: build
  image: electronuserland/builder:wine
  before_script:
    - npm ci
    - python -m venv venv
    - venv/Scripts/activate.bat
    - pip install -r requirements.txt
  script:
    - npm run dist -- --win
  artifacts:
    paths:
      - dist/*.exe
    expire_in: 1 week
  only:
    - tags
    - main
  tags:
    - windows

# macOS build  
build:macos:
  stage: build
  before_script:
    - npm ci
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
  script:
    - npm run dist -- --mac
  artifacts:
    paths:
      - dist/*.dmg
    expire_in: 1 week
  only:
    - tags
    - main
  tags:
    - macos
    
# Manual build trigger
build:manual:
  stage: build
  image: node:22
  before_script:
    - apt-get update -qq && apt-get install -y python3 python3-pip python3-venv
    - npm ci
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
  script:
    - npm run dist
  artifacts:
    paths:
      - dist/*
    expire_in: 1 week
  when: manual
  tags:
    - linux